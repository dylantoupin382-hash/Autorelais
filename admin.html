<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTORELAIS — Administration</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;--card:#fff;--accent:#f97316;--accent2:#ea580c;--green:#16a34a;--red:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}
button,input,select{font:inherit}button{cursor:pointer}.top{background:#111827;color:#fff;padding:14px 18px}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{font-weight:900;font-size:22px}.logo span{color:var(--accent)}
.wrap{max-width:1180px;margin:auto;padding:28px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}.login{max-width:430px;margin:70px auto}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:800;color:var(--muted)}input,select{border:1px solid #d1d5db;border-radius:10px;padding:12px;background:#fff}.primary{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:12px 17px;font-weight:800}.primary:hover{background:var(--accent2)}.ghost{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 14px;font-weight:700}.muted{color:var(--muted)}.hidden{display:none!important}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.head h1{margin:0;font-size:30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{display:block;font-size:27px;margin-top:8px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input{min-width:240px;flex:1}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1020px}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}th{font-size:12px;color:var(--muted);background:#fafafa;position:sticky;top:0}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;font-weight:800}.pill.nouveau{background:#ffedd5;color:#9a3412}.pill.contacte{background:#dbeafe;color:#1d4ed8}.pill.rdv{background:#f3e8ff;color:#7e22ce}.pill.vendu{background:#dcfce7;color:#166534}.pill.refuse{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;text-decoration:none;color:var(--ink)}.small:hover{border-color:#cbd5e1}.error{color:var(--red);font-size:13px;margin-top:10px}.empty{text-align:center;padding:35px;color:var(--muted)}
@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.wrap{padding:20px 12px}.login{margin:35px auto}.topin{align-items:flex-start}.topin .ghost{padding:8px 10px}}
</style>
</head>
<body>
<div class="top"><div class="topin"><div class="logo">AUTO<span>RELAIS</span> <span style="color:#9ca3af;font-weight:700">Admin</span></div><button id="logoutBtn" class="ghost hidden" onclick="logout()">Déconnexion</button></div></div>

<div id="loginView" class="wrap">
  <div class="card login">
    <h1>Connexion administrateur</h1>
    <p class="muted">Cet espace contient les coordonnées des vendeurs et doit rester privé.</p>
    <div class="field"><label>MOT DE PASSE</label><input id="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe"></div>
    <button id="loginBtn" class="primary" style="width:100%;margin-top:14px" onclick="login()">Se connecter</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<div id="dashboardView" class="wrap hidden">
  <div class="head"><div><h1>Demandes vendeurs</h1><div class="muted">Données enregistrées depuis le formulaire AUTORELAIS.</div></div><button class="ghost" onclick="loadData()">Actualiser</button></div>
  <div class="stats">
    <div class="stat">Total<b id="statTotal">0</b></div>
    <div class="stat">Nouvelles<b id="statNew">0</b></div>
    <div class="stat">Rendez-vous<b id="statRdv">0</b></div>
    <div class="stat">Vendues<b id="statSold">0</b></div>
  </div>
  <div class="toolbar">
    <input id="search" placeholder="Rechercher nom, téléphone, marque, modèle…" oninput="render()">
    <select id="filterStatus" onchange="render()"><option value="">Tous les statuts</option><option value="nouveau">Nouveau</option><option value="contacte">Contacté</option><option value="rdv">RDV</option><option value="vendu">Vendu</option><option value="refuse">Refusé</option></select>
  </div>
  <div class="tablewrap"><table><thead><tr><th>Date</th><th>Vendeur</th><th>Contact</th><th>Véhicule</th><th>Prix</th><th>Ville</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<script>
let demandes=[];

async function api(path, options={}){
  const r=await fetch(path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const data=await r.json().catch(()=>({}));
  if(r.status===401){showLogin();throw new Error('Non autorisé');}
  if(!r.ok)throw new Error(data.error||'Erreur');
  return data;
}
async function login(){
  const btn=document.getElementById('loginBtn'), err=document.getElementById('loginError');
  err.textContent=''; btn.disabled=true; btn.textContent='Connexion…';
  try{
    await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('password').value})});
    document.getElementById('password').value='';
    await startDashboard();
  }catch(e){err.textContent='Mot de passe incorrect ou connexion impossible.'}
  finally{btn.disabled=false;btn.textContent='Se connecter'}
}
async function logout(){try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch(e){}showLogin()}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('dashboardView').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden')}
function showDashboard(){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboardView').classList.remove('hidden');document.getElementById('logoutBtn').classList.remove('hidden')}
async function startDashboard(){showDashboard();await loadData()}
async function loadData(){try{const d=await api('/api/admin/demandes');demandes=d.demandes||[];updateStats();render()}catch(e){}}
function updateStats(){
  document.getElementById('statTotal').textContent=demandes.length;
  document.getElementById('statNew').textContent=demandes.filter(x=>x.statut==='nouveau').length;
  document.getElementById('statRdv').textContent=demandes.filter(x=>x.statut==='rdv').length;
  document.getElementById('statSold').textContent=demandes.filter(x=>x.statut==='vendu').length;
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function money(v){return v?new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(v):'—'}
function datefr(v){if(!v)return'—';const d=new Date(String(v).replace(' ','T')+'Z');return isNaN(d)?esc(v):d.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}
function render(){
  const q=document.getElementById('search').value.toLowerCase().trim(), f=document.getElementById('filterStatus').value;
  const list=demandes.filter(x=>{
    const hay=[x.prenom,x.nom,x.telephone,x.email,x.marque,x.modele,x.ville].join(' ').toLowerCase();
    return (!q||hay.includes(q))&&(!f||x.statut===f);
  });
  document.getElementById('rows').innerHTML=list.length?list.map(x=>`
    <tr>
      <td>${datefr(x.created_at)}</td>
      <td><b>${esc(x.prenom)} ${esc(x.nom)}</b><br><span class="muted">#${x.vehicule_id}</span></td>
      <td><a href="tel:${esc(x.telephone)}">${esc(x.telephone)}</a><br><a href="mailto:${esc(x.email)}">${esc(x.email)}</a></td>
      <td><b>${esc(x.marque)} ${esc(x.modele)}</b><br><span class="muted">${esc(x.annee||'')} · ${x.kilometrage?Number(x.kilometrage).toLocaleString('fr-FR')+' km':'—'} · ${esc(x.energie||'')}</span></td>
      <td>${money(x.prix_souhaite)}</td>
      <td>${esc(x.ville||'—')}</td>
      <td><span class="pill ${esc(x.statut)}">${labelStatus(x.statut)}</span></td>
      <td><div class="actions">
        <a class="small" href="tel:${esc(x.telephone)}">Appeler</a>
        <select class="small" onchange="changeStatus(${Number(x.vehicule_id)},this.value)">
          ${['nouveau','contacte','rdv','vendu','refuse'].map(s=>`<option value="${s}" ${x.statut===s?'selected':''}>${labelStatus(s)}</option>`).join('')}
        </select>
      </div></td>
    </tr>`).join(''):'<tr><td colspan="8" class="empty">Aucune demande trouvée.</td></tr>';
}
function labelStatus(s){return({nouveau:'Nouveau',contacte:'Contacté',rdv:'RDV',vendu:'Vendu',refuse:'Refusé'})[s]||s}
async function changeStatus(id,statut){
  try{
    await api('/api/admin/vehicules/'+id+'/statut',{method:'PATCH',body:JSON.stringify({statut})});
    const x=demandes.find(d=>Number(d.vehicule_id)===Number(id));if(x)x.statut=statut;updateStats();render();
  }catch(e){alert('Impossible de modifier le statut.')}
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
(async()=>{try{await api('/api/admin/me');await startDashboard()}catch(e){showLogin()}})();
</script>
</body>
</html>
